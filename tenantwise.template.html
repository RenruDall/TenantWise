* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }

.bar input[type=search] { width:100%; height:32px; padding:0 10px 0 32px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; font-size:13px; }

.rootpath a, .rootpath b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
aside .type { color:var(--mute); font-size:12px; overflow-wrap:anywhere; }

.rel { color:var(--mute); font-size:11px; display:block; overflow-wrap:anywhere; }
.tag { display:inline-block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.045em; line-height:16px; border-radius:5px; padding:0 6px; margin-left:5px; vertical-align:1px; background:var(--chip); color:var(--mute); white-space:nowrap; }
.tag.priv { background:var(--soft-high); color:var(--sev-high); } .tag.amber { background:var(--soft-med); color:var(--sev-med); }
.tag.perm { text-transform:none; letter-spacing:0; font-weight:550; font-size:11px; white-space:normal; overflow-wrap:anywhere; margin:1px 4px 1px 0; } .tag.good { background:var(--soft-ok); color:var(--ok); }
.path { font-size:12px; color:var(--mute); }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
.chips button { border:1px solid var(--line); background:var(--bg); color:var(--mute); border-radius:999px; padding:2px 10px; font:inherit; font-size:12px; cursor:pointer; }
.chips button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:8px 0; }
.stats div { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 9px; font-size:11px; color:var(--mute); }
.stats b { display:block; font-size:18px; font-weight:650; letter-spacing:-.02em; color:var(--ink); }
.warn { background:var(--chip); border-left:3px solid var(--sev-med); padding:6px 10px; font-size:12px; margin:0 16px; }
#overlay { position:fixed; inset:0; background:color-mix(in srgb, var(--frame) 72%, transparent); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
#overlay .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px 32px; max-width:500px; width:100%; max-height:calc(100vh - 32px); overflow:auto; box-shadow:0 24px 60px rgba(4,12,24,.35); }
#overlay .card.wide { max-width:760px; }

.form label { display:block; font-size:13px; margin:10px 0 0; }
.form input { display:block; width:100%; margin-top:5px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
.form input:focus { outline:2px solid var(--acc); outline-offset:0; }
.form details { margin-top:12px; font-size:13px; } .form summary { cursor:pointer; color:var(--acc); }
.err { background:color-mix(in srgb, var(--c-priv) 14%, transparent); border-left:3px solid var(--c-priv); padding:6px 10px; font-size:13px; }
.warn-inline { background:var(--chip); border-left:3px solid var(--sev-med); padding:6px 10px; font-size:13px; }
[data-ext] { color:var(--acc); cursor:pointer; text-decoration:underline; }
.credit { margin:14px 0 0; font-size:11px; }
table.grid { border-collapse:collapse; width:100%; margin:6px 0; font-size:13px; font-variant-numeric:tabular-nums; }

table.grid tbody tr:hover { background:color-mix(in srgb, var(--acc) 3%, transparent); }
.tablecard { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:auto; margin:8px 0; }
.tablecard table.grid { margin:0; } .tablecard table.grid th { background:var(--bg); position:sticky; top:0; z-index:1; }
.tablecard table.grid tr:last-child td { border-bottom:0; }

.facts { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:6px 0; font-size:13px; }
.facts dt { color:var(--mute); } .facts dd { margin:0; overflow-wrap:anywhere; }
code { font:11.5px var(--mono); overflow-wrap:anywhere; }
.btn.small { padding:2px 8px; font-size:12px; }
.rv { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; background:var(--bg); }
.rvh { display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
.rvh > div { flex:1; min-width:0; }
.rv table.grid { table-layout:fixed; }

.signoff { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
.signoff input#rv-name { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; margin-left:6px; }

.spin { width:22px; height:22px; border:3px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px; }

function overlay(html, wide) {
  $("ocard").className = "card" + (wide ? " wide" : ""); $("ocard").innerHTML = html; $("overlay").style.display = html ? "flex" : "none";
  for (const el of $("ocard").querySelectorAll("[data-ico]")) if (!el.querySelector("svg")) el.insertAdjacentHTML("afterbegin", ico(el.dataset.ico));

const host = window.chrome && window.chrome.webview;
const pending = new Map();
let seq = 0;
function call(cmd, args) {                                   // ask the app; it answers with a "reply" message
  return new Promise((resolve, reject) => {
    if (!host) return reject(new Error("TenantWise app not available."));
    const id = String(++seq);
    pending.set(id, { resolve, reject });
    host.postMessage({ id, cmd, args: args || {} });
  });
}
if (host) host.addEventListener("message", ev => {
  const m = ev.data || {};
  if (m.type === "progress") { const el = $("progress"); if (el) el.textContent = m.text; return; }
  if (m.type !== "reply" || !pending.has(m.id)) return;
  const p = pending.get(m.id); pending.delete(m.id);
  m.ok ? p.resolve(m.result) : p.reject(new Error(m.error || "Something went wrong."));
});
