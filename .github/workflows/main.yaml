name: Build TenantWise

# Push a tag like v1.0.0 to test, build, sign and publish TenantWise as a GitHub Release.
# Every push to main and every pull request runs the tests and builds the app (never signed, never published).
# "Run workflow" on the Actions tab builds a test copy (download it from the run's artifacts).
# No app ID is built in: each organization registers TenantWise in its own tenant and enters its app (client) ID once.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read          # SignPath reads the build's artifacts and details

# Code signing (SignPath Foundation) runs for release tags and manual runs, and only when the secret SIGNPATH_API_TOKEN
# and the repository variable SIGNPATH_ORGANIZATION_ID exist. Otherwise the files are built unsigned. See CODE_SIGNING.md.
env:
  SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
  SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'TenantWise' }}
  SIGNPATH_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}

jobs:
  # The tests run on their own, without any signing secret or write permission.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Test against a fake Azure + Entra tenant
        shell: pwsh
        run: |
          python3 tests/fake_tenant.py tests/out
          python3 tests/free_tenant.py tests/out
          ./tests/Test-TenantWise.ps1

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 300   # leaves time to approve the signing request in SignPath
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          dotnet build src/TenantWise.App/TenantWise.App.csproj -c Release "-p:Version=$version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem src/TenantWise.App/bin/Release/net48 -Recurse -File | Select-Object -First 40 | Format-Table Length, FullName -AutoSize

      # Package versions are locked in packages.lock.json (restore runs in locked mode on the build server once they are
      # committed). A missing lock file is shown here, ready to commit, and makes a release fail.
      - name: Package lock files
        shell: pwsh
        run: |
          $missing = 0
          foreach ($f in 'src/TenantWise.Core/packages.lock.json', 'src/TenantWise.App/packages.lock.json') {
            if (git ls-files $f) { "$f is committed: restore ran in locked mode"; continue }
            $missing++
            $text = (Get-Content $f -Raw).Replace("`r", '')
            $parts = [Math]::Ceiling($text.Length / 3000)                  # annotations hold at most 4096 characters
            for ($i = 0; $i -lt $parts; $i++) {
              $chunk = $text.Substring($i * 3000, [Math]::Min(3000, $text.Length - $i * 3000)).Replace('%', '%25').Replace("`n", '%0A')
              "::notice title=Commit $f (part $($i + 1) of $parts)::$chunk"
            }
          }
          if ($missing -and $env:GITHUB_REF_TYPE -eq 'tag') { "::error::Commit the package lock files before releasing."; exit 1 }

      - name: Check the app
        shell: powershell   # Windows PowerShell (.NET Framework) loads the net48 app natively
        run: |
          $exe = (Resolve-Path src/TenantWise.App/bin/Release/net48/TenantWise.exe).Path
          $asm = [System.Reflection.Assembly]::LoadFile($exe)
          $names = $asm.GetManifestResourceNames()
          foreach ($r in 'tenantwise.template.html', 'cytoscape.min.js', 'tenantwise-icons.js', 'tenantwise-font.css', 'tenantwise.ico') { if ($r -notin $names) { throw "Not embedded: $r" } }
          $dir = Split-Path $exe
          foreach ($f in 'TenantWise.Core.dll', 'Microsoft.Identity.Client.dll', 'Microsoft.Identity.Client.Broker.dll', 'Microsoft.Web.WebView2.Wpf.dll', 'System.Text.Json.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing $f" }
          }
          if (-not (Get-ChildItem $dir -Recurse -Filter WebView2Loader.dll)) { throw 'Missing WebView2Loader.dll' }
          if (-not (Get-ChildItem $dir -Recurse -Filter 'msalruntime*.dll')) { throw 'Missing msalruntime (Windows sign-in broker)' }
          "Version: $((Get-Item $exe).VersionInfo.ProductVersion)"

      # --- Sign TenantWise's own program files (TenantWise.exe, TenantWise.Core.dll) before packaging them
      - name: Upload program files for signing
        if: env.SIGNING == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-app
          path: |
            src/TenantWise.App/bin/Release/net48/TenantWise.exe
            src/TenantWise.App/bin/Release/net48/TenantWise.Core.dll
          if-no-files-found: error

      - name: Sign program files (approve in SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIGURATION || 'app' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed/app

      - name: Use the signed program files
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($f in 'TenantWise.exe', 'TenantWise.Core.dll') {
            $sig = Get-AuthenticodeSignature "signed/app/$f"
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            Copy-Item "signed/app/$f" "src/TenantWise.App/bin/Release/net48/$f" -Force
            "$f signed by $($sig.SignerCertificate.Subject)"
          }

      # The installer is built with Inno Setup from Chocolatey, pinned to one version, and its compiler must carry the
      # publisher's valid signature before it builds anything that gets signed in TenantWise's name.
      - name: Installer and portable zip
        shell: pwsh
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $sig = Get-AuthenticodeSignature $iscc
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw "Inno Setup compiler not signed by its publisher: $($sig.Status) $($sig.SignerCertificate.Subject)" }
          "Inno Setup $((choco list innosetup --exact --limit-output) -join ' '), signed by $($sig.SignerCertificate.Subject)"
          & $iscc "/DAppVersion=$env:VERSION" installer\TenantWise.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path src/TenantWise.App/bin/Release/net48/*, LICENSE, NOTICE, THIRD-PARTY-NOTICES.txt -DestinationPath "dist/TenantWise-portable-$env:VERSION.zip"

      # --- Sign the installer
      - name: Upload installer for signing
        if: env.SIGNING == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-installer
          path: dist/TenantWise-Setup-*.exe
          if-no-files-found: error

      - name: Sign installer (approve in SignPath)
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION || 'installer' }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed/installer

      - name: Use the signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem signed/installer -Filter 'TenantWise-Setup-*.exe') {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            Copy-Item $f.FullName "dist/$($f.Name)" -Force
            "$($f.Name) signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Checksums
        shell: pwsh
        run: |
          $sums = foreach ($f in Get-ChildItem dist -File) { (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $f.Name }
          $sums | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          if ($env:SIGNING -ne 'true' -and $env:GITHUB_REF_TYPE -eq 'tag') { '::warning::Built without code signing (SIGNPATH_API_TOKEN or SIGNPATH_ORGANIZATION_ID not set). Windows Smart App Control will block these files.' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TenantWise
          path: dist/

  # Software bill of materials (SPDX) of the files TenantWise ships, made on every run so it is always tested.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TenantWise
          path: dist

      - name: Unpack the portable copy
        shell: bash
        run: |
          zip=$(ls dist/TenantWise-portable-*.zip)
          version=${zip#dist/TenantWise-portable-}; version=${version%.zip}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p app sbom && unzip -q "$zip" -d app

      - uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          path: app
          format: spdx-json
          output-file: sbom/TenantWise-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TenantWise-sbom
          path: sbom/
          if-no-files-found: error

  # Only this job may write to the repository, and only for a release tag.
  release:
    needs: [build, sbom]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # signs the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TenantWise
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TenantWise-sbom
          path: dist

      - name: Build provenance (gh attestation verify <file> --repo RenruDall/TenantWise)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
